<!-- MÓDULO: Hero Evento Educativo -->
<!-- Uso: Banner principal para eventos, charlas, seminarios -->
<!-- Ancho: 600px | Compatible: Email clients -->

<table width="600" cellpadding="0" cellspacing="0" border="0" style="background:linear-gradient(135deg, #00b0db 0%, #0088aa 100%); border-collapse:collapse; font-family:Arial,sans-serif; margin:0 auto; max-width:600px;">
  <tr>
    <td style="padding:40px 30px; text-align:center; color:#ffffff;">
      
      <!-- Logo/Branding opcional -->
      <div style="margin-bottom:30px; font-size:11px; letter-spacing:1px; text-transform:uppercase; opacity:0.9;">
        Evento Académico
      </div>

      <!-- Título Principal -->
      <h1 style="font-size:48px; font-weight:700; line-height:1.2; margin:0 0 20px 0; color:#ffffff;">
        Lorem Ipsum Dolor
      </h1>

      <!-- Subtítulo -->
      <p style="font-size:16px; line-height:1.6; margin:0 0 30px 0; color:#ffffff; opacity:0.95;">
        Un encuentro especial entre líderes y profesionales
      </p>

      <!-- Información de Evento -->
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0;">
        <tr>
          <td align="center" style="padding:8px;">
            <div style="background-color:rgba(255,255,255,0.2); border-radius:8px; padding:10px 15px; display:inline-block;">
              <div style="font-size:12px; opacity:0.9; margin-bottom:4px;">📅 FECHA</div>
              <div style="font-size:14px; font-weight:700;">19 de Mayo</div>
            </div>
          </td>
          <td align="center" style="padding:8px;">
            <div style="background-color:rgba(255,255,255,0.2); border-radius:8px; padding:10px 15px; display:inline-block;">
              <div style="font-size:12px; opacity:0.9; margin-bottom:4px;">🕐 HORA</div>
              <div style="font-size:14px; font-weight:700;">15:30 - 21:00</div>
            </div>
          </td>
          <td align="center" style="padding:8px;">
            <div style="background-color:rgba(255,255,255,0.2); border-radius:8px; padding:10px 15px; display:inline-block;">
              <div style="font-size:12px; opacity:0.9; margin-bottom:4px;">📍 LUGAR</div>
              <div style="font-size:14px; font-weight:700;">Campus UC</div>
            </div>
          </td>
        </tr>
      </table>

      <!-- CTA Button -->
      <div style="margin-top:30px;">
        <a href="#" style="background-color:#ffd700; color:#00b0db; padding:14px 40px; text-decoration:none; border-radius:6px; font-weight:700; font-size:14px; display:inline-block; letter-spacing:0.5px;">
          REGISTRATE AHORA
        </a>
      </div>

    </td>
  </tr>
</table>
