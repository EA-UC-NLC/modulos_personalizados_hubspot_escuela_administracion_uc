<!-- MÓDULO: Dividers y Headers de Sección -->
<!-- Uso: Separar secciones del email, crear divisiones visuales -->
<!-- Ancho: 600px | Compatible: Email clients -->

<table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff; border-collapse:collapse; font-family:Arial,sans-serif; margin:0 auto; max-width:600px;">
  <tr>
    <td style="padding:30px 25px;">
      
      <!-- Divider Lineal Simple -->
      <div style="height:1px; background-color:#e0e0e0; margin:30px 0;"></div>

      <!-- Divider con Icono Central -->
      <div style="text-align:center; margin:40px 0; position:relative;">
        <div style="height:1px; background-color:#e0e0e0; position:absolute; top:50%; left:0; right:0; z-index:1;"></div>
        <div style="background-color:#ffffff; padding:0 15px; position:relative; z-index:2; display:inline-block;">
          <span style="font-size:24px;">⭐</span>
        </div>
      </div>

      <!-- Header de Sección - Azul -->
      <div style="background-color:#00b0db; color:#ffffff; padding:20px 20px; border-radius:8px 8px 0 0; text-align:center; margin:30px 0 0 0;">
        <h3 style="font-size:22px; font-weight:700; margin:0; letter-spacing:0.5px;">
          AGENDA DEL EVENTO
        </h3>
      </div>

      <!-- Header de Sección - Amarillo -->
      <div style="background:linear-gradient(90deg, #ffd700 0%, #ffed4e 100%); color:#03122E; padding:20px 20px; border-radius:8px; text-align:center; margin:30px 0;">
        <h3 style="font-size:20px; font-weight:700; margin:0; letter-spacing:0.5px;">
          ¿Por qué asistir?
        </h3>
      </div>

      <!-- Header de Sección - Oscuro -->
      <div style="background-color:#03122E; color:#ffffff; padding:20px 20px; border-radius:8px; text-align:center; margin:30px 0;">
        <h3 style="font-size:20px; font-weight:700; margin:0; letter-spacing:0.5px;">
          INFORMACIÓN IMPORTANTE
        </h3>
      </div>

      <!-- Divider Color Gradiente -->
      <div style="height:3px; background:linear-gradient(90deg, #00b0db 0%, #ffd700 50%, #00b0db 100%); margin:30px 0;"></div>

      <!-- Divider Doble Línea -->
      <div style="height:1px; background-color:#ddd; margin:20px 0;"></div>
      <div style="height:1px; background-color:#ddd; margin:20px 0;"></div>

    </td>
  </tr>
</table>
