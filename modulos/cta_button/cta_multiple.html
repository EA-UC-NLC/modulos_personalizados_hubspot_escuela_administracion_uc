<!-- MÓDULO: Botones CTA Personalizables -->
<!-- Uso: Llamadas a acción, inscripciones, ver más -->
<!-- Ancho: 600px | Compatible: Email clients -->

<table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff; border-collapse:collapse; font-family:Arial,sans-serif; margin:0 auto; max-width:600px;">
  <tr>
    <td style="padding:40px 25px; text-align:center;">
      
      <!-- Botón CTA Primario (Azul) -->
      <div style="margin-bottom:20px;">
        <a href="#" style="background-color:#00b0db; color:#ffffff; padding:16px 50px; text-decoration:none; border-radius:6px; font-weight:700; font-size:15px; display:inline-block; letter-spacing:0.5px; box-shadow:0 4px 12px rgba(0,176,219,0.3); transition:all 0.3s ease;">

        </a>

      <!-- Botón CTA Secundario (Dorado) -->
      <div style="margin-bottom:20px;">

        </a>
      </div>

      <div style="margin-bottom:20px;">
        <a href="#" style="background-color:#ffffff; color:#00b0db; padding:14px 48px; text-decoration:none; border-radius:6px; border:2px solid #00b0db; font-weight:700; font-size:15px; display:inline-block; letter-spacing:0.5px;">

        </a>

      <!-- Botón con icono pequeño -->
      <div style="margin-bottom:0;">
        <a href="#" style="background-color:#4a5f9d; color:#ffffff; padding:16px 40px; text-decoration:none; border-radius:6px; font-weight:700; font-size:15px; display:inline-block; letter-spacing:0.5px; box-shadow:0 4px 12px rgba(74,95,157,0.3);">
          📧 ENVIAR INFORMACIÓN
        </a>
      </div>

    </td>
