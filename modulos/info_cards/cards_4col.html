<!-- MÓDULO: Info Cards con Iconos (4 cards) -->
<!-- Uso: Mostrar características, beneficios, pricing, requerimientos -->
<!-- Ancho: 600px | Compatible: Email clients -->

<table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8f9fa; border-collapse:collapse; font-family:Arial,sans-serif; margin:0 auto; max-width:600px;">
  <tr>
    <td style="padding:30px 20px;">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="table-layout:fixed;">
        <tr>
          <!-- Card 1 -->
          <td align="center" style="padding:6px; vertical-align:top;">
            <div style="background-color:#ffffff; border-radius:12px; box-shadow:0 4px 12px rgba(0,60,90,0.12); padding:20px 15px; text-align:center; min-height:160px; display:flex; flex-direction:column; justify-content:center;">
              <div style="margin-bottom:12px;">
                <img src="https://cdn-icons-png.flaticon.com/128/2370/2370264.png" width="40" height="40" alt="Calendario" style="border:0; display:inline-block;">
              </div>
              <div style="font-size:13px; font-weight:700; color:#03122E; margin-bottom:8px;">
                Duración
              </div>
              <div style="font-size:12px; color:#666; line-height:1.4;">
                6 meses<br/>
                Clases 2x semana
              </div>
            </div>
          </td>

          <!-- Card 2 -->
          <td align="center" style="padding:6px; vertical-align:top;">
            <div style="background-color:#ffffff; border-radius:12px; box-shadow:0 4px 12px rgba(0,60,90,0.12); padding:20px 15px; text-align:center; min-height:160px; display:flex; flex-direction:column; justify-content:center;">
              <div style="margin-bottom:12px;">
                <img src="https://cdn-icons-png.flaticon.com/128/601/601019.png" width="40" height="40" alt="Horario" style="border:0; display:inline-block;">
              </div>
              <div style="font-size:13px; font-weight:700; color:#03122E; margin-bottom:8px;">
                Horario
              </div>
              <div style="font-size:12px; color:#666; line-height:1.4;">
                Tarde & Noche<br/>
                Flexible
              </div>
            </div>
          </td>

          <!-- Card 3 -->
          <td align="center" style="padding:6px; vertical-align:top;">
            <div style="background-color:#ffffff; border-radius:12px; box-shadow:0 4px 12px rgba(0,60,90,0.12); padding:20px 15px; text-align:center; min-height:160px; display:flex; flex-direction:column; justify-content:center;">
              <div style="margin-bottom:12px;">
                <img src="https://cdn-icons-png.flaticon.com/128/4021/4021967.png" width="40" height="40" alt="Modalidad" style="border:0; display:inline-block;">
              </div>
              <div style="font-size:13px; font-weight:700; color:#03122E; margin-bottom:8px;">
                Modalidad
              </div>
              <div style="font-size:12px; color:#666; line-height:1.4;">
                Presencial<br/>
                + Online
              </div>
            </div>
          </td>

          <!-- Card 4 -->
          <td align="center" style="padding:6px; vertical-align:top;">
            <div style="background-color:#ffffff; border-radius:12px; box-shadow:0 4px 12px rgba(0,60,90,0.12); padding:20px 15px; text-align:center; min-height:160px; display:flex; flex-direction:column; justify-content:center;">
              <div style="margin-bottom:12px;">
                <svg width="40" height="40" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;">
                  <path d="M10 22L20 32L38 14" stroke="#00b0db" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="24" cy="24" r="22" stroke="#00b0db" stroke-width="1.5" fill="none" opacity="0.3"/>
                </svg>
              </div>
              <div style="font-size:13px; font-weight:700; color:#03122E; margin-bottom:8px;">
                Certificado
              </div>
              <div style="font-size:12px; color:#666; line-height:1.4;">
                Acreditado UC<br/>
                Reconocido
              </div>

        </tr>
      </table>
